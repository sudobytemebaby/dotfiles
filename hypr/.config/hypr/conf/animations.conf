animations {
  # Enable or disable all animations globally
  enabled = yes

  # ---------- BEZIER CURVES (EASING PROFILES) ----------
  # Custom timing curves defining how animations accelerate/decelerate.
  # Format: bezier = <name>, X1, Y1, X2, Y2
  
    bezier = smooth, 0.25, 0.8, 0.25, 1    # Gentle start, quick middle, smooth end - no flicker
    bezier = quick, 0.15, 0, 0.1, 1        # Snappy — good for fast fades or pop-ins
    bezier = linear, 0, 0, 1, 1            # Constant speed (no acceleration)

  # ---------- WINDOW ANIMATIONS ----------
  # Affects window open/close/move.
  # Uses 'smooth' for flicker-free motion + 'slide' style.
  
    animation = windows, 1, 3.5, smooth, slide

  # ---------- WORKSPACE TRANSITIONS ----------
  # Controls animation when switching workspaces.
  # Smooth slide motion for confident, responsive feel.
  
    animation = workspaces, 1, 3, smooth, slide

  # ---------- FADES ----------
  # Fade animations for windows and general UI elements.
  # fadeIn matches window timing to prevent conflicts.
  
    animation = fadeIn, 1, 3.5, smooth       # Match window timing exactly
    animation = fadeOut, 1, 1.5, linear      # Quick fade-out
    animation = fade, 1, 2.5, quick          # General-purpose fade

  # ---------- LAYERS (POPUPS, OVERLAYS, ETC.) ----------
  # Animations for layer surfaces like notifications, bars, menus.
  # Smooth appearance with quick dismissal.
  
    animation = layers, 1, 3.5, smooth
    animation = layersIn, 1, 3.5, smooth, fade
    animation = layersOut, 1, 1, linear, fade

  # ---------- FADE LAYERS ----------
  # Subtle fade for layer surfaces appearing/disappearing.
  
    animation = fadeLayersIn, 1, 2, quick
    animation = fadeLayersOut, 1, 1, linear
}
