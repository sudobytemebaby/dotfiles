# Foot terminal rules
windowrule = opacity 0.8 override, match:class ^foot$
windowrule = opacity 0.8 override, match:class ^footclient$

layerrule {
  name = Blur quickshell
  match:namespace = quickshell
  blur = on 
  ignore_alpha = 0.5
}

windowrule {
  name = Satty annotation
  match:class = ^com.gabm.satty$
  float = on
  center = on
  size = 1100 700
}

# XDG Desktop Portal GTK (most common on Hyprland)
windowrule {
  name = xdg gtk file picker
  match:class = ^xdg-desktop-portal-gtk$
  float = on
  center = on
  size = 900 700
}

# Native GTK file choosers (fallback for apps not using portal)
windowrule {
  name = File upload dialog
  match:title = ^File Upload$
  float = on
  center = on
  size = 900 700
}

windowrule {
  name = Open file dialog
  match:title = ^Open File$
  float = on
  center = on
  size = 900 700
}

windowrule {
  name = Save as dialog
  match:title = ^Save As$
  float = on
  center = on
  size = 900 700
}

windowrule {
  name = Save file dialog
  match:title = ^Save File$
  float = on
  center = on
  size = 900 700
}

windowrule {
  name = Calculator
  match:class = ^org.gnome.Calculator$
  float = on
  center = on
  size = 460 550 
}

windowrule {
  name = Translator 
  match:class = ^app.drey.Dialect$
  float = on
  center = on
  size = 500 550 
}

windowrule {
  name = Floating Terminal Small 
  match:class = ^floating_term_s$
  float = on
  center = on
  opacity = 0.8
  size = 800 600 
}

windowrule {
  name = Floating Terminal Medium 
  match:class = ^floating_term_m$
  float = on
  center = on
  opacity = 0.8
  size = 900 700 
}

windowrule {
  name = Floating Terminal Large 
  match:class = ^floating_term_l$
  float = on
  center = on
  opacity = 0.8
  size = 1200 800 
}

windowrule {
  name = Floating Terminal XLarge 
  match:class = ^floating_term_xl$
  float = on
  center = on
  opacity = 0.8
  size = 1340 800 
}

layerrule = match:namespace noctalia-shell:regionSelector, no_anim on
