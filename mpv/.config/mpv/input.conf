# Audio delay fine-tuning (no defaults in mpv for these)
Ctrl+LEFT   add audio-delay -0.1
Ctrl+RIGHT  add audio-delay 0.1

# Toggle debanding (useful when content has heavy banding or for testing)
D           cycle deband

# Cycle subtitle style override: respect original → force mpv font → strip tags
Alt+s       cycle-values sub-ass-override no force strip

# Stats overlay
i           script-binding stats/display-stats
I           script-binding stats/display-stats-toggle
