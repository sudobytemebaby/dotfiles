# System: AMD Ryzen 7 8845H + Radeon 780M (RDNA3)
#         2880×1800 @ 120 Hz, 2× HiDPI, Wayland / Vulkan

###############
# VIDEO OUTPUT
###############

vo=gpu-next
gpu-api=vulkan

# VA-API hardware decode → Vulkan via dmabuf (zero-copy, confirmed working)
hwdec=vaapi
hwdec-codecs=all

video-sync=display-resample

##########
# SCALING
##########

# spline36: good quality upscale (1080p → 2880×1800), reasonable iGPU cost
scale=spline36
dscale=hermite
cscale=spline36
scale-antiring=0.3

dither-depth=auto
dither=fruit

# Debanding is expensive at 2880×1800 — off by default, toggle with D
deband=no

############
# HDR/COLOR
############

# Only activates for actual HDR streams, no-op for SDR
hdr-compute-peak=auto
tone-mapping=bt.2446a
target-colorspace-hint=yes

############
# PLAYBACK
############

keep-open=yes
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid

hr-seek=yes
hr-seek-framedrop=no
audio-pitch-correction=yes

#########
# AUDIO
#########

volume=100
volume-max=200
audio-normalize-downmix=yes
alang=en,eng,ja,jpn,de,ger,fr,fre

#############
# SUBTITLES
#############

sub-auto=fuzzy
slang=en,eng,und
sub-file-paths-append=subs:subtitles:Subs:Subtitles:sub:Sub

sub-font="Noto Sans"
sub-font-size=40

sub-color=1/1/1/1
sub-back-color=0/0/0/0.7
sub-border-style=background-box
sub-border-size=5
sub-outline-size=0
sub-shadow-offset=0

sub-spacing=0

sub-ass-override=no

#######
# OSD
#######

osc=no
osd-bar=no

osd-font="Noto Sans"
osd-font-size=32
osd-color="#FFFFFFFF"
osd-border-color="#FF000000"
osd-border-size=1.5
osd-shadow-offset=1
osd-shadow-color="#33000000"

##########
# WINDOW
##########

title="${filename} — mpv"
autofit-larger=90%x90%
geometry=50%:50%
cursor-autohide=1000
force-seekable=yes

###############
# SCREENSHOTS
###############

screenshot-format=png
screenshot-png-compression=7
screenshot-directory=~/Pictures/mpv
screenshot-template="%F_%p_%04n"
screenshot-high-bit-depth=yes

################
# CACHE / NET
################

cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=30
network-timeout=60

ytdl=yes
ytdl-format=bestvideo[height<=?2160]+bestaudio/best

[protocol.http]
cache=yes
demuxer-readahead-secs=20
demuxer-max-bytes=50MiB

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
