# 200px logical × scale_factor=2 = 400px physical → sharp on 2× HiDPI display
max_height=100
max_width=200
scale_factor=2

# Pre-generate thumbnails when file loads (faster hover response)
spawn_first=yes

tone_mapping=auto

# Disable for network/audio (thumbnails would stall or be pointless)
network=no
audio=no
hwdec=no
