# Timeline
timeline_style=bar
timeline_size=38
timeline_persistency=paused,audio,idle
timeline_border=0

# Thin progress bar always visible in windowed mode
progress=windowed
progress_size=2
progress_line_width=20

# Controls bar — chapters shown when present; speed only for video
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,<video>speed,space,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=paused,audio,idle

# Volume sidebar
volume=right
volume_size=38

# Top bar (title + window controls in borderless / fullscreen)
top_bar=no-border
top_bar_size=38
top_bar_controls=right
top_bar_title=yes
top_bar_flash_on=video,audio

# Scale — mpv handles HiDPI; fullscreen bumps up 30%
# Font is inherited from osd-font in mpv.conf (Noto Sans)
scale=1
scale_fullscreen=1.3
border_radius=4
text_border=1.2
animation_duration=100

# Hide UI when cursor auto-hides (clean fullscreen experience)
autohide=yes
pause_indicator=flash

# Let system autoload.lua manage directory playlists
autoload=no

# Colored chapter ranges on timeline (openings/endings = teal, ads = red)
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80

# Language follows mpv's --slang, fallback to English
languages=slang,en
