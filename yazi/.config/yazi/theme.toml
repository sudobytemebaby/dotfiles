# : Manager [[[

[mgr]
cwd = { fg = "#e3e2e6" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff70e3", bg = "#ff70e3" }
marker_cut      = { fg = "#ffd6f7", bg = "#ffd6f7" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#eeb4e6", bg = "#eeb4e6" }

# Count
count_copied   = { fg = "#320a33", bg = "#ffd6f7" }
count_cut      = { fg = "#320a33", bg = "#ffd6f7" }
count_selected = { fg = "#182e5e", bg = "#eeb4e6" }

# Border
border_symbol = "│"
border_style  = { fg = "#b1c5ff" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#b1c5ff", bold = true, bg = "#121317" }
inactive  = { fg = "#bfc6df", bg = "#121317" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#b1c5ff", fg = "#182e5e", bold = true }
normal_alt  = { bg = "#44464f", fg = "#c5c6d0" }

# Select mode
select_main = { bg = "#bfc6df", fg = "#293044", bold = true }
select_alt  = { bg = "#44464f", fg = "#c5c6d0" }

# Unset mode
unset_main = { bg = "#eeb4e6", fg = "#4a2049", bold = true }
unset_alt  = { bg = "#44464f", fg = "#c5c6d0" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#596bac" }
perm_write = { fg = "#d237bc" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff3dd9" }
perm_sep   = { fg = "#416aff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#b1c5ff", bg = "#38393d" }
progress_error  = { fg = "#ffb4ab", bg = "#38393d" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#38393d" }
cand = { fg = "#b1c5ff" }
rest = { fg = "#182e5e" }
desc = { fg = "#e3e2e6" }
separator = " ▶ "
separator_style = { fg = "#e3e2e6" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#eeb4e6" }
title_warn  = { fg = "#b1c5ff" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#b1c5ff" }
active = { fg = "#eeb4e6", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#b1c5ff" }
value  = { fg = "#e3e2e6" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#b1c5ff", bg = "#182e5e" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#b1c5ff" }
title   = {}
hovered = { fg = "#ffd6f7", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e3e2e6" }
run    = { fg = "#e3e2e6" }
footer = { fg = "#293044", bg = "#bfc6df" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e3e2e6" },
    { url = "*/", fg = "#b1c5ff" },
]

# : ]]]
