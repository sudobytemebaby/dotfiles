# : Manager [[[

[mgr]
cwd = { fg = "#e4e2e6" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ff71db", bg = "#ff71db" }
marker_cut      = { fg = "#ffd7f5", bg = "#ffd7f5" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#ebb6e0", bg = "#ebb6e0" }

# Count
count_copied   = { fg = "#300d2e", bg = "#ffd7f5" }
count_cut      = { fg = "#300d2e", bg = "#ffd7f5" }
count_selected = { fg = "#222e57", bg = "#ebb6e0" }

# Border
border_symbol = "│"
border_style  = { fg = "#b9c5f7" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#b9c5f7", bold = true, bg = "#131316" }
inactive  = { fg = "#c2c5db", bg = "#131316" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#b9c5f7", fg = "#222e57", bold = true }
normal_alt  = { bg = "#45464e", fg = "#c6c6d0" }

# Select mode
select_main = { bg = "#c2c5db", fg = "#2b3041", bold = true }
select_alt  = { bg = "#45464e", fg = "#c6c6d0" }

# Unset mode
unset_main = { bg = "#ebb6e0", fg = "#482344", bold = true }
unset_alt  = { bg = "#45464e", fg = "#c6c6d0" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#626aa2" }
perm_write = { fg = "#ca3ead" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#ff3ecf" }
perm_sep   = { fg = "#435eff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#b9c5f7", bg = "#39393c" }
progress_error  = { fg = "#ffb4ab", bg = "#39393c" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#39393c" }
cand = { fg = "#b9c5f7" }
rest = { fg = "#222e57" }
desc = { fg = "#e4e2e6" }
separator = " ▶ "
separator_style = { fg = "#e4e2e6" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#ebb6e0" }
title_warn  = { fg = "#b9c5f7" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#b9c5f7" }
active = { fg = "#ebb6e0", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#b9c5f7" }
value  = { fg = "#e4e2e6" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#b9c5f7", bg = "#222e57" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#b9c5f7" }
title   = {}
hovered = { fg = "#ffd7f5", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e4e2e6" }
run    = { fg = "#e4e2e6" }
footer = { fg = "#2b3041", bg = "#c2c5db" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e4e2e6" },
    { url = "*/", fg = "#b9c5f7" },
]

# : ]]]
